<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="560" fill="#ffffff"/>

  <!-- Aviso -->
  <polygon points="30,30 62,30 46,2" transform="translate(0,22)" fill="#f5c518" stroke="#a17c00" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="52" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">!</text>
  <text x="80" y="42" font-size="17" fill="#222">Nota: para alimentar el equipo por Type-C 5 V, conecta el cable</text>
  <text x="80" y="64" font-size="17" fill="#222">en el puerto correcto. Si lo conectas en otro puerto,</text>
  <text x="80" y="86" font-size="17" fill="#222">puedes dañar el producto.</text>

  <!-- Tester -->
  <rect x="190" y="130" width="320" height="300" rx="16" fill="#3a3a3a"/>
  <rect x="215" y="175" width="270" height="225" rx="6" fill="#111"/>
  <rect x="235" y="195" width="230" height="185" fill="#222" stroke="#555"/>
  <text x="350" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#ddd">TREEDIX</text>
  <text x="350" y="418" font-size="12" text-anchor="middle" fill="#ccc">www.treedix.com</text>

  <!-- Izquierda: correcto -->
  <rect x="100" y="270" width="90" height="46" rx="4" fill="#3a3a3a"/>
  <rect x="20" y="290" width="80" height="8" fill="#555"/>
  <circle cx="145" cy="293" r="16" fill="none" stroke="#6fdc6f" stroke-width="3"/>
  <path d="M137 296 l8 -16 l-2 12 h8 l-8 16 l2 -12 z" fill="#6fdc6f"/>
  <circle cx="75" cy="390" r="36" fill="none" stroke="#2e9e3f" stroke-width="8"/>
  <path d="M58 390 l12 14 l24 -30" fill="none" stroke="#2e9e3f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="450" font-size="16" font-weight="bold" fill="#2e9e3f">Entrada de</text>
  <text x="20" y="470" font-size="16" font-weight="bold" fill="#2e9e3f">alimentación</text>
  <text x="20" y="490" font-size="16" font-weight="bold" fill="#2e9e3f">(Vin-C) · ¡Aquí sí!</text>

  <!-- Derecha: incorrecto -->
  <rect x="510" y="215" width="90" height="46" rx="4" fill="#3a3a3a"/>
  <rect x="600" y="235" width="80" height="8" fill="#555"/>
  <circle cx="555" cy="238" r="16" fill="none" stroke="#ccc" stroke-width="3"/>
  <path d="M547 241 l8 -16 l-2 12 h8 l-8 16 l2 -12 z" fill="#ccc"/>
  <line x1="548" y1="226" x2="562" y2="250" stroke="#ccc" stroke-width="3"/>
  <circle cx="600" cy="330" r="34" fill="none" stroke="#d62d2d" stroke-width="8"/>
  <path d="M580 310 L620 350 M620 310 L580 350" stroke="#d62d2d" stroke-width="9" stroke-linecap="round"/>

  <!-- Abajo: incorrecto -->
  <rect x="327" y="430" width="46" height="70" rx="4" fill="#3a3a3a"/>
  <rect x="346" y="500" width="8" height="50" fill="#555"/>
  <circle cx="350" cy="460" r="16" fill="none" stroke="#ccc" stroke-width="3"/>
  <path d="M342 463 l8 -16 l-2 12 h8 l-8 16 l2 -12 z" fill="#ccc"/>
  <line x1="343" y1="449" x2="357" y2="473" stroke="#ccc" stroke-width="3"/>
  <circle cx="250" cy="500" r="30" fill="none" stroke="#d62d2d" stroke-width="7"/>
  <path d="M233 483 L267 517 M267 483 L233 517" stroke="#d62d2d" stroke-width="8" stroke-linecap="round"/>

  <!-- Etiqueta puertos sin energía -->
  <text x="440" y="500" font-size="17" font-weight="bold" fill="#d62d2d">Puerto sin energía:</text>
  <text x="440" y="522" font-size="17" font-weight="bold" fill="#d62d2d">¡No conectar aquí!</text>
  <line x1="395" y1="470" x2="435" y2="495" stroke="#d62d2d" stroke-width="2"/>
  <line x1="560" y1="268" x2="560" y2="295" stroke="#d62d2d" stroke-width="2"/>
  <text x="640" y="390" font-size="14" font-weight="bold" text-anchor="middle" fill="#d62d2d">PORT A</text>
</svg>
